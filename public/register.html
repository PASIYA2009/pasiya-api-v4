<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>Register — PASIYA API</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"><link rel="stylesheet" href="/auth.css"></head><body><header class="bar"><a class="brand" href="/"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M32 3l25 14.5v29L32 61 7 46.5v-29z" fill="#0b1220" stroke="url(#lg)" stroke-width="3"/><path d="M24 46V19h12a8.5 8.5 0 010 17H24" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>PASIYA API</b><small>by Pasidu Eshan</small></span></a><nav><button class="ib" id="themeBtn" aria-label="Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><a class="link" href="/login">Log in</a><a class="btn sm" href="/register">Register</a></nav></header>
<main class="wrap"><div class="card">
<div class="hero"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M32 3l25 14.5v29L32 61 7 46.5v-29z" fill="#0b1220" stroke="url(#lg)" stroke-width="3"/><path d="M24 46V19h12a8.5 8.5 0 010 17H24" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>Create Personal Account</h1><p class="sub">Join PASIYA API &amp; claim your free coins!</p></div>
<div class="bonus">🎁 <span id="bonus">Bonus: Free Coins + Private API Key</span></div>
<div class="social"><button class="btn" id="gBtn" type="button"><svg viewBox="0 0 24 24"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 01-1.9 2.8v2.3h3A9 9 0 0021 12.2z" fill="#4285f4" stroke="none"/><path d="M12 21c2.5 0 4.6-.8 6.1-2.3l-3-2.3a5.6 5.6 0 01-8.3-2.9H3.7v2.4A9 9 0 0012 21z" fill="#34a853" stroke="none"/><path d="M6.8 13.5a5.4 5.4 0 010-3.4V7.7H3.7a9 9 0 000 8.2z" fill="#fbbc05" stroke="none"/><path d="M12 6.6c1.4 0 2.6.5 3.6 1.4l2.7-2.7A9 9 0 003.7 7.7l3.1 2.4A5.4 5.4 0 0112 6.6z" fill="#ea4335" stroke="none"/></svg> Continue with Google</button></div>
<div class="or">or with credentials</div>
<form id="f" novalidate>
<label for="un">Username:</label><div class="in"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><input id="un" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" placeholder="Choose clean username"></div><div class="hint" id="unHint"></div>
<label for="em">Gmail / Email Address:</label><div class="in"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input id="em" type="email" autocomplete="email" placeholder="youremail@gmail.com"></div>
<label for="pw">Password:</label><div class="in"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><input id="pw" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"><button type="button" data-eye aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<label for="pw2">Confirm Password:</label><div class="in"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><input id="pw2" type="password" autocomplete="new-password" placeholder="Re-type password"></div>
<button class="btn main go" id="go" type="submit"><span id="goTxt">Register &amp; claim coins</span> →</button>
</form>
<p class="msg" id="msg" role="status"></p>
<p class="alt">Already have an account? <a href="/login">Log in</a></p>
</div></main><div class="toast" id="toast" role="status"></div>
<script type="module">
import { $, msg, friendly, boot, social, done, api, loadConfig, toast } from '/auth.js';
loadConfig((c) => { if (c.signupCoins) { $('#bonus').textContent = 'Bonus: Free ' + c.signupCoins + ' Coins + Private API Key'; $('#goTxt').textContent = 'Register & claim ' + c.signupCoins + ' coins'; } });
const ctx = await boot().catch(() => null);
if (!ctx) msg('Sign-up could not load. Check your connection and reload.');
else {
  let creating = false;
  const RE = /^[A-Za-z0-9_.]{3,20}$/;
  ctx.A.onAuthStateChanged(ctx.auth, (u) => { if (u && !creating) location.replace('/'); });
  $('#gBtn').onclick = () => social(ctx);
  const hint = $('#unHint'); let t;
  $('#un').oninput = (e) => {
    const v = e.target.value.trim(); clearTimeout(t); hint.className = 'hint';
    if (!v) return (hint.textContent = '');
    if (!RE.test(v)) { hint.textContent = '3-20 letters, numbers, dot or underscore.'; hint.classList.add('bad'); return; }
    hint.textContent = 'Checking…';
    t = setTimeout(async () => {
      try { const d = await api('/api/auth/available?username=' + encodeURIComponent(v)); if (v !== $('#un').value.trim()) return; hint.textContent = d.available ? 'Username is available ✓' : 'Username is taken'; hint.className = 'hint ' + (d.available ? 'good' : 'bad'); } catch { hint.textContent = ''; }
    }, 400);
  };
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    const un = $('#un').value.trim(), em = $('#em').value.trim(), pw = $('#pw').value, pw2 = $('#pw2').value;
    if (!RE.test(un)) return msg('Username: 3-20 letters, numbers, dot or underscore.');
    if (!em) return msg('Enter your email address.');
    if (pw.length < 8) return msg('Password must be at least 8 characters.');
    if (pw !== pw2) return msg('Passwords do not match.');
    $('#go').disabled = true; creating = true;
    try {
      msg('Checking username…', '');
      if (!(await api('/api/auth/available?username=' + encodeURIComponent(un))).available) throw new Error('That username is taken. Choose another.');
      msg('Creating your account…', '');
      const cred = await ctx.A.createUserWithEmailAndPassword(ctx.auth, em, pw);
      await ctx.A.updateProfile(cred.user, { displayName: un }).catch(() => {});
      await api('/api/auth/username', { method: 'POST', body: JSON.stringify({ username: un }) }, cred.user).catch((er) => toast(er.message));
      await ctx.A.sendEmailVerification(cred.user).catch(() => {});
      done();
    } catch (er) { msg(friendly(er)); creating = false; }
    $('#go').disabled = false;
  };
}
</script></body></html>
