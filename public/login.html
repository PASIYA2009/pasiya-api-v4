<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>Login — PASIYA API</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"><link rel="stylesheet" href="/auth.css"></head><body><header class="bar"><a class="brand" href="/"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M32 3l25 14.5v29L32 61 7 46.5v-29z" fill="#0b1220" stroke="url(#lg)" stroke-width="3"/><path d="M24 46V19h12a8.5 8.5 0 010 17H24" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>PASIYA API</b><small>by Pasidu Eshan</small></span></a><nav><button class="ib" id="themeBtn" aria-label="Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><a class="link" href="/login">Log in</a><a class="btn sm" href="/register">Register</a></nav></header>
<main class="wrap"><div class="card">
<div class="hero"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M32 3l25 14.5v29L32 61 7 46.5v-29z" fill="#0b1220" stroke="url(#lg)" stroke-width="3"/><path d="M24 46V19h12a8.5 8.5 0 010 17H24" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>Welcome to <em>PASIYA</em> API</h1><p class="sub">Sign in to access your API key, coin balance and dashboard.</p></div>
<div class="social"><button class="btn" id="gBtn" type="button"><svg viewBox="0 0 24 24"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 01-1.9 2.8v2.3h3A9 9 0 0021 12.2z" fill="#4285f4" stroke="none"/><path d="M12 21c2.5 0 4.6-.8 6.1-2.3l-3-2.3a5.6 5.6 0 01-8.3-2.9H3.7v2.4A9 9 0 0012 21z" fill="#34a853" stroke="none"/><path d="M6.8 13.5a5.4 5.4 0 010-3.4V7.7H3.7a9 9 0 000 8.2z" fill="#fbbc05" stroke="none"/><path d="M12 6.6c1.4 0 2.6.5 3.6 1.4l2.7-2.7A9 9 0 003.7 7.7l3.1 2.4A5.4 5.4 0 0112 6.6z" fill="#ea4335" stroke="none"/></svg> Continue with Google</button></div>
<div class="or">or with email</div>
<form id="f" novalidate>
<label for="id">Username or Registered Email:</label><div class="in"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><input id="id" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="username or email@domain.com"></div>
<div class="row"><label for="pw">Password:</label><a href="#" id="forgot">Forgot password?</a></div>
<div class="in"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><input id="pw" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" data-eye aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<button class="btn main go" id="go" type="submit">Sign in to dashboard →</button>
</form>
<p class="msg" id="msg" role="status"></p>
<p class="alt">Don't have an account yet? <a href="/register" id="regLink">Register (Get free coins)</a></p>
</div></main><div class="toast" id="toast" role="status"></div>
<script type="module">
import { $, msg, friendly, boot, social, done, api, loadConfig } from '/auth.js';
loadConfig((c) => { if (c.signupCoins) $('#regLink').textContent = 'Register (Get ' + c.signupCoins + ' Free Coins)'; });
const ctx = await boot().catch(() => null);
if (!ctx) msg('Sign-in could not load. Check your connection and reload.');
else {
  ctx.A.onAuthStateChanged(ctx.auth, (u) => { if (u) location.replace('/'); });
  $('#gBtn').onclick = () => social(ctx);
  async function emailOf(v) { v = v.trim(); if (v.includes('@')) return v; return (await api('/api/auth/resolve?username=' + encodeURIComponent(v))).email; }
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    const id = $('#id').value, pw = $('#pw').value;
    if (!id.trim() || !pw) return msg('Enter your username/email and password.');
    $('#go').disabled = true;
    try { msg('Signing in…', ''); await ctx.A.signInWithEmailAndPassword(ctx.auth, await emailOf(id), pw); done(); } catch (er) { msg(friendly(er)); }
    $('#go').disabled = false;
  };
  $('#forgot').onclick = async (e) => {
    e.preventDefault();
    if (!$('#id').value.trim()) return msg('Type your username or email first.');
    try { await ctx.A.sendPasswordResetEmail(ctx.auth, await emailOf($('#id').value)); msg('Password reset email sent. Check your inbox.', 'good'); } catch (er) { msg(friendly(er)); }
  };
}
</script></body></html>
